<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>桌面機器人</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-style="looi">
    <div id="rotateGate" class="rotate-gate" hidden>
      <div class="rotate-card">
        <div class="phone-icon" aria-hidden="true">
          <span class="phone-body"></span>
          <span class="rotate-arrow">↻</span>
        </div>
        <p>請將手機橫放在桌上</p>
        <p class="hint">橫式後會變成機器人的臉</p>
      </div>
    </div>

    <main id="stage" class="stage">
      <section id="eyes" class="eyes" data-emotion="idle" aria-label="機器人雙眼">
        <div class="eye-pane">
          <div class="eye" data-side="left">
            <div class="lid lid-top"></div>
            <div class="sclera">
              <div class="pupil">
                <div class="iris-ring"></div>
                <div class="shine"></div>
                <div class="shine shine-sm"></div>
              </div>
            </div>
            <div class="lid lid-bottom"></div>
          </div>
        </div>
        <div class="eye-pane">
          <div class="eye" data-side="right">
            <div class="lid lid-top"></div>
            <div class="sclera">
              <div class="pupil">
                <div class="iris-ring"></div>
                <div class="shine"></div>
                <div class="shine shine-sm"></div>
              </div>
            </div>
            <div class="lid lid-bottom"></div>
          </div>
        </div>
      </section>

      <div id="startPanel" class="start-panel">
        <div class="start-sheet">
          <p class="start-title">選眼睛樣式</p>
          <div id="stylePicker" class="style-picker" role="listbox" aria-label="眼睛樣式">
            <div
              class="style-card"
              data-style="looi"
              role="option"
              tabindex="0"
              aria-selected="true"
            >
              <span class="style-preview preview-looi" aria-hidden="true">
                <i></i><i></i>
              </span>
              <span class="style-name">A · LOOI 光眼</span>
              <span class="style-desc">黑底發光膠囊眼</span>
            </div>
            <div
              class="style-card"
              data-style="orb"
              role="option"
              tabindex="0"
              aria-selected="false"
            >
              <span class="style-preview preview-orb" aria-hidden="true">
                <i></i><i></i>
              </span>
              <span class="style-name">B · 圓潤瞳孔</span>
              <span class="style-desc">柔和立體卡通眼</span>
            </div>
            <div
              class="style-card"
              data-style="mono"
              role="option"
              tabindex="0"
              aria-selected="false"
            >
              <span class="style-preview preview-mono" aria-hidden="true">
                <i></i><i></i>
              </span>
              <span class="style-name">C · 極簡黑點</span>
              <span class="style-desc">乾淨扁平機器人</span>
            </div>
            <div
              class="style-card"
              data-style="led"
              role="option"
              tabindex="0"
              aria-selected="false"
            >
              <span class="style-preview preview-led" aria-hidden="true">
                <i></i><i></i>
              </span>
              <span class="style-name">D · LED 矩眼</span>
              <span class="style-desc">螢幕像素機器人</span>
            </div>
          </div>
          <button id="startBtn" class="start-btn" type="button">喚醒機器人</button>
          <p id="status" class="status" hidden></p>
        </div>
      </div>
    </main>

    <div class="capture" aria-hidden="true">
      <video id="video" playsinline muted autoplay></video>
      <canvas id="motionCanvas"></canvas>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
