<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>桌面機器人</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="rotateGate" class="rotate-gate" hidden>
      <div class="rotate-card">
        <div class="phone-icon" aria-hidden="true">
          <span class="phone-body"></span>
          <span class="rotate-arrow">↻</span>
        </div>
        <p>請將手機橫放在桌上</p>
        <p class="hint">橫式後會變成機器人的臉</p>
      </div>
    </div>

    <main id="stage" class="stage">
      <section id="face" class="face" data-emotion="idle" data-blink="0" aria-label="機器人臉">
        <div id="fx" class="fx" aria-hidden="true"></div>

        <div class="eye-pane">
          <svg class="bot-eye" data-side="left" viewBox="0 0 120 120" aria-hidden="true">
            <defs>
              <filter id="glowL" x="-40%" y="-40%" width="180%" height="180%">
                <feGaussianBlur stdDeviation="2.2" result="b" />
                <feMerge>
                  <feMergeNode in="b" />
                  <feMergeNode in="SourceGraphic" />
                </feMerge>
              </filter>
            </defs>
            <g class="glow" filter="url(#glowL)">
              <g class="shape shape-oval">
                <ellipse class="white" cx="60" cy="60" rx="34" ry="44" />
                <g class="pupil-layer">
                  <ellipse class="pupil" cx="60" cy="62" rx="14" ry="20" />
                  <circle class="shine" cx="52" cy="50" r="5" />
                </g>
              </g>
              <g class="shape shape-happy">
                <path
                  class="white"
                  d="M28 68 C40 38, 80 38, 92 68 C78 58, 42 58, 28 68 Z"
                />
              </g>
              <g class="shape shape-sad">
                <path
                  class="white"
                  d="M30 52 C42 78, 78 78, 90 52 C76 62, 44 62, 30 52 Z"
                />
              </g>
              <g class="shape shape-angry">
                <path class="white" d="M26 48 L94 38 L90 78 L30 86 Z" />
                <g class="pupil-layer">
                  <ellipse class="pupil" cx="58" cy="64" rx="11" ry="15" />
                </g>
              </g>
              <g class="shape shape-soft">
                <ellipse class="white" cx="60" cy="64" rx="36" ry="28" />
                <g class="pupil-layer">
                  <ellipse class="pupil" cx="60" cy="66" rx="13" ry="14" />
                </g>
              </g>
              <g class="shape shape-wide">
                <ellipse class="white" cx="60" cy="60" rx="40" ry="40" />
                <g class="pupil-layer">
                  <ellipse class="pupil" cx="60" cy="62" rx="18" ry="22" />
                  <circle class="shine" cx="50" cy="48" r="6" />
                </g>
              </g>
              <g class="shape shape-line">
                <rect class="white" x="24" y="54" width="72" height="12" rx="6" />
              </g>
              <g class="shape shape-heart">
                <path
                  class="white"
                  d="M60 92 C20 68, 28 34, 60 48 C92 34, 100 68, 60 92 Z"
                />
              </g>
              <g class="shape shape-x">
                <rect class="white" x="28" y="54" width="64" height="12" rx="4" transform="rotate(40 60 60)" />
                <rect class="white" x="28" y="54" width="64" height="12" rx="4" transform="rotate(-40 60 60)" />
              </g>
              <g class="shape shape-wink">
                <path
                  class="white"
                  d="M28 66 C42 48, 78 48, 92 66"
                  fill="none"
                  stroke="#f4fbff"
                  stroke-width="10"
                  stroke-linecap="round"
                />
              </g>
            </g>
          </svg>
        </div>

        <div class="eye-pane">
          <svg class="bot-eye" data-side="right" viewBox="0 0 120 120" aria-hidden="true">
            <defs>
              <filter id="glowR" x="-40%" y="-40%" width="180%" height="180%">
                <feGaussianBlur stdDeviation="2.2" result="b" />
                <feMerge>
                  <feMergeNode in="b" />
                  <feMergeNode in="SourceGraphic" />
                </feMerge>
              </filter>
            </defs>
            <g class="glow" filter="url(#glowR)">
              <g class="shape shape-oval">
                <ellipse class="white" cx="60" cy="60" rx="34" ry="44" />
                <g class="pupil-layer">
                  <ellipse class="pupil" cx="60" cy="62" rx="14" ry="20" />
                  <circle class="shine" cx="52" cy="50" r="5" />
                </g>
              </g>
              <g class="shape shape-happy">
                <path
                  class="white"
                  d="M28 68 C40 38, 80 38, 92 68 C78 58, 42 58, 28 68 Z"
                />
              </g>
              <g class="shape shape-sad">
                <path
                  class="white"
                  d="M30 52 C42 78, 78 78, 90 52 C76 62, 44 62, 30 52 Z"
                />
              </g>
              <g class="shape shape-angry">
                <path class="white" d="M26 38 L94 48 L90 86 L30 78 Z" />
                <g class="pupil-layer">
                  <ellipse class="pupil" cx="62" cy="64" rx="11" ry="15" />
                </g>
              </g>
              <g class="shape shape-soft">
                <ellipse class="white" cx="60" cy="64" rx="36" ry="28" />
                <g class="pupil-layer">
                  <ellipse class="pupil" cx="60" cy="66" rx="13" ry="14" />
                </g>
              </g>
              <g class="shape shape-wide">
                <ellipse class="white" cx="60" cy="60" rx="40" ry="40" />
                <g class="pupil-layer">
                  <ellipse class="pupil" cx="60" cy="62" rx="18" ry="22" />
                  <circle class="shine" cx="50" cy="48" r="6" />
                </g>
              </g>
              <g class="shape shape-line">
                <rect class="white" x="24" y="54" width="72" height="12" rx="6" />
              </g>
              <g class="shape shape-heart">
                <path
                  class="white"
                  d="M60 92 C20 68, 28 34, 60 48 C92 34, 100 68, 60 92 Z"
                />
              </g>
              <g class="shape shape-x">
                <rect class="white" x="28" y="54" width="64" height="12" rx="4" transform="rotate(40 60 60)" />
                <rect class="white" x="28" y="54" width="64" height="12" rx="4" transform="rotate(-40 60 60)" />
              </g>
              <g class="shape shape-wink">
                <ellipse class="white" cx="60" cy="60" rx="34" ry="44" />
                <g class="pupil-layer">
                  <ellipse class="pupil" cx="60" cy="62" rx="14" ry="20" />
                </g>
              </g>
            </g>
          </svg>
        </div>
      </section>

      <div id="startPanel" class="start-panel">
        <div class="start-sheet">
          <p class="start-title">桌面機器人臉</p>
          <p class="start-hint">左右分邊 OLED 表情眼 · 含疑惑／愛心等輔助符號</p>
          <button id="startBtn" class="start-btn" type="button">喚醒機器人</button>
          <p id="status" class="status" hidden></p>
        </div>
      </div>
    </main>

    <div class="capture" aria-hidden="true">
      <video id="video" playsinline muted autoplay></video>
      <canvas id="motionCanvas"></canvas>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
