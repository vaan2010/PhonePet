<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>桌面機器人</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="rotateGate" class="rotate-gate" hidden>
      <div class="rotate-card">
        <div class="phone-icon" aria-hidden="true">
          <span class="phone-body"></span>
          <span class="rotate-arrow">↻</span>
        </div>
        <p>請將手機橫放在桌上</p>
        <p class="hint">橫式後會變成機器人的臉</p>
      </div>
    </div>

    <main id="stage" class="stage">
      <section id="eyes" class="eyes" data-emotion="idle" aria-label="機器人雙眼">
        <div class="eye" data-side="left">
          <div class="lid lid-top"></div>
          <div class="sclera">
            <div class="pupil">
              <div class="shine"></div>
            </div>
          </div>
          <div class="lid lid-bottom"></div>
        </div>
        <div class="eye" data-side="right">
          <div class="lid lid-top"></div>
          <div class="sclera">
            <div class="pupil">
              <div class="shine"></div>
            </div>
          </div>
          <div class="lid lid-bottom"></div>
        </div>
      </section>

      <button id="startBtn" class="start-overlay" type="button">
        點一下喚醒機器人
      </button>
      <p id="status" class="status" hidden></p>
    </main>

    <div class="capture" aria-hidden="true">
      <video id="video" playsinline muted autoplay></video>
      <canvas id="motionCanvas"></canvas>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
